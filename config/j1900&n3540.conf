# ==============================================================================
# J1900 四核专用 PREEMPT_RT 配置 (Linux 7.3.x)
# 用法: make x86_64_defconfig
#       scripts/kconfig/merge_config.sh .config j1900-7.3-rt.config
#       make olddefconfig
# ==============================================================================

# ---- 1. 基础与版本标识 ----
CONFIG_LOCALVERSION="-j1900-rt"
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
# 7.3 中 EXPERT 是 PREEMPT_RT 可见的前提
CONFIG_EXPERT=y

# ---- 2. 实时抢占核心 (J1900 四核) ----
# J1900 为四核四线程，NR_CPUS 设为 4
CONFIG_NR_CPUS=4
# PREEMPT_RT 总开关
CONFIG_PREEMPT_RT=y
CONFIG_HZ_1000=y
CONFIG_HIGH_RES_TIMERS=y
# 性能调控器，避免降频引发音频延迟
CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y
CONFIG_INTEL_IDLE=y

# ---- 3. 内核压缩 ----
# CONFIG_KERNEL_GZIP is not set
CONFIG_KERNEL_ZSTD=y
CONFIG_RD_ZSTD=y

# ---- 4. 显示 (RT 下 i915 不可用，走 simpledrm/vesa) ----
CONFIG_DRM=y
CONFIG_DRM_SIMPLEDRM=y
CONFIG_SYSFB=y
CONFIG_SYSFB_SIMPLEFB=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FB=y
CONFIG_FB_EFI=y
CONFIG_FB_VESA=y

# ---- 5. USB 与输入 (DAC 与键鼠) ----
CONFIG_USB=y
CONFIG_USB_PCI=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_UHCI_HCD=y
CONFIG_USB_STORAGE=y
CONFIG_USB UAS=y
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_INPUT=y
CONFIG_INPUT_KEYBOARD=y
CONFIG_KEYBOARD_ATKBD=y
CONFIG_INPUT_MOUSE=y
CONFIG_MOUSE_PS2=y
CONFIG_INPUT_MOUSEDEV=y
CONFIG_INPUT_EVDEV=y
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_USB_HID=y
CONFIG_HIDRAW=y
CONFIG_UHID=y
CONFIG_NEW_LEDS=y
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_CLASS_MULTICOLOR=y
CONFIG_HID_LOGITECH=m
CONFIG_HID_LOGITECH_DJ=m
CONFIG_HID_MICROSOFT=m
CONFIG_HID_CHERRY=m

# ---- 6. 音频 (USB DAC + 板载 HDA) ----
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_PCI=y
CONFIG_SND_X86=y
CONFIG_SND_HDA_INTEL=y
CONFIG_SND_HDA_CODEC_REALTEK=y
CONFIG_SND_HDA_CODEC_HDMI=y
CONFIG_SND_HDA_GENERIC=y
CONFIG_SND_HDA_POWER_SAVE_DEFAULT=0
CONFIG_SND_USB_AUDIO=y
CONFIG_SND_SOC=m
CONFIG_SND_SOC_INTEL_SST_TOPLEVEL=y
CONFIG_SND_SST_ATOM_HIFI2_PLATFORM_ACPI=m

# ---- 7. 网络 (仅 RTL8111，内建) ----
CONFIG_R8169=y
CONFIG_REALTEK_PHY=y
CONFIG_TCP_CONG_BBR=y
CONFIG_DEFAULT_BBR=y
CONFIG_DEFAULT_TCP_CONG="bbr"

# ---- 8. 存储与文件系统 ----
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_MSDOS_FS=y
CONFIG_NLS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_CIFS=m
CONFIG_CIFS_STATS2=y
CONFIG_CIFS_ALLOW_INSECURE_LEGACY=y
CONFIG_CIFS_XATTR=y
CONFIG_CIFS_POSIX=y

# ---- 9. Bay Trail 平台基础 ----
CONFIG_I2C=y
CONFIG_X86_INTEL_LPSS=y
CONFIG_GPIOLIB=y
CONFIG_SPI=y
CONFIG_COMMON_CLK=y

# ---- 10. 精简 (关闭无关硬件与调试) ----
# CONFIG_HYPERVISOR_GUEST is not set
# CONFIG_VIRTIO_MENU is not set
# CONFIG_VHOST_MENU is not set
# CONFIG_E1000 is not set
# CONFIG_E1000E is not set
# CONFIG_IGB is not set
# CONFIG_WLAN is not set
# CONFIG_BT is not set
# CONFIG_XFS_FS is not set
# CONFIG_BTRFS_FS is not set
# CONFIG_SQUASHFS is not set
# CONFIG_OVERLAY_FS is not set
# CONFIG_KALLSYMS_ALL is not set
# CONFIG_FTRACE is not set
# CONFIG_KPROBES is not set
# CONFIG_PROFILING is not set