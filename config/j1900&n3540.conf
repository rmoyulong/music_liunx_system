#
# Linux/x86 7.3.3 Kernel Configuration --- RT 实时内核（模块化版）
# 目标平台：Intel J1900 (Bay Trail-D)，x86_64
# 实际硬件：RTL8111 有线网卡（无线网卡、蓝牙本机不存在）
# 特点：J1900 为四核四线程（4C4T），已按此优化 NR_CPUS 与内核版本标识
#
# 用法：先 make x86_64_defconfig，再用 merge_config.sh 叠加本文件，
#       最后 make olddefconfig 补全依赖。
#       6.12 起 PREEMPT_RT 已并入主线，无需打补丁。
#
# 模块策略（混合模式：关键驱动内建 + 其余模块化）：
#   =y：根文件系统、显示、USB 控制器/存储、HID/键盘鼠标、控制台、板载主网卡、
#       Bay Trail 平台基础（I2C/GPIO/LPSS/SPI）、MMC
#   =m：声卡、CIFS、Netfilter/NAT（按需加载，不占开机时间）
#

# ---- 0. 模块支持 ----
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y

# ---- 1. 本地版本与抢占模型 ----
CONFIG_LOCALVERSION="-rt-j1900"
CONFIG_EXPERT=y

CONFIG_PREEMPT_RT=y
CONFIG_HZ_1000=y
CONFIG_HIGH_RES_TIMERS=y

# ---- 1b. 内核镜像压缩算法（zstd，解压最快）----
# CONFIG_KERNEL_GZIP is not set
CONFIG_KERNEL_ZSTD=y
CONFIG_RD_ZSTD=y 

# ---- 1c. CPU 数量上限（J1900 为四核，精确匹配）----
# J1900 是 4C4T，NR_CPUS=4 精确匹配。
CONFIG_NR_CPUS=4

# ---- 2. 电源管理（RT 下用 Performance，避免引入延迟）----
CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y
CONFIG_INTEL_IDLE=y

# ============================================================
# ========== A. 关键驱动 —— 内建（=y） ======================
# ============================================================

# ---- 3. 显示 ----
# RT 下 i915 不可用，改用 simpledrm 提供控制台显示
CONFIG_DRM=y
CONFIG_DRM_SIMPLEDRM=y
CONFIG_SYSFB=y
CONFIG_SYSFB_SIMPLEFB=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FB=y
CONFIG_FB_VESA=y

# ---- 4. USB 主机控制器（键鼠/U盘必需，内建）----
CONFIG_USB=y
CONFIG_USB_PCI=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_UHCI_HCD=y
CONFIG_USB_STORAGE=y
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y

# ---- 5. 输入设备核心 + HID（键盘鼠标必需，内建）----
CONFIG_INPUT=y
CONFIG_INPUT_KEYBOARD=y
CONFIG_KEYBOARD_ATKBD=y
CONFIG_INPUT_MOUSE=y
CONFIG_MOUSE_PS2=y
CONFIG_MOUSE_PS2_ALPS=y
CONFIG_MOUSE_PS2_LOGIPS2PP=y
CONFIG_MOUSE_PS2_SYNAPTICS=y
CONFIG_MOUSE_PS2_CYPRESS=y
CONFIG_MOUSE_PS2_TRACKPOINT=y
CONFIG_MOUSE_PS2_ELANTECH=y
CONFIG_MOUSE_PS2_SENTELIC=y
CONFIG_MOUSE_PS2_TOUCHKIT=y
CONFIG_MOUSE_PS2_FOCALTECH=y
CONFIG_INPUT_MOUSEDEV=y
CONFIG_INPUT_EVDEV=y
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_USB_HID=y
CONFIG_HIDRAW=y
CONFIG_UHID=y

# ---- 5.1 品牌专用 HID 驱动（按需自动加载）----
CONFIG_NEW_LEDS=y
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_CLASS_MULTICOLOR=y
CONFIG_HID_LOGITECH=m
CONFIG_HID_LOGITECH_DJ=m
CONFIG_HID_LOGITECH_HIDPP=m
CONFIG_HID_MICROSOFT=m
CONFIG_HID_A4TECH=m
CONFIG_HID_CHERRY=m
CONFIG_HID_REDRAGON=m
CONFIG_HID_APPLE=m

# ---- 6. 控制台 / TTY ----
CONFIG_TTY=y
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_CONSOLE_TRANSLATIONS=y
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y

# ---- 7. 板载主网卡（RTL8111，内建保证一定有网）----
CONFIG_R8169=y
CONFIG_REALTEK_PHY=y

# ---- 8. 文件系统（根 FS 与 EFI 分区必需，内建）----
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_MSDOS_FS=y
CONFIG_NLS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y

# ---- 9. Bay Trail 平台基础（SoC 音频/外设的内建依赖）----
CONFIG_I2C=y
# CONFIG_I2C_DESIGNWARE_PLATFORM is not set
CONFIG_X86_INTEL_LPSS=y
CONFIG_GPIOLIB=y
CONFIG_SPI=y
CONFIG_COMMON_CLK=y

# ---- 10. SD 卡（部分工控板带 SD 槽；用不到可关）----
CONFIG_MMC=m

# ============================================================
# ========== B. 其余驱动 —— 模块化（=m） ====================
# ============================================================

# ---- 11. 声卡（模块化；本机走 HDA + Realtek）----
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_PCI=y
CONFIG_SND_X86=y
CONFIG_SND_HDA_INTEL=y
CONFIG_SND_HDA_CODEC_REALTEK=y
CONFIG_SND_HDA_CODEC_HDMI=y
CONFIG_SND_HDA_GENERIC=y
CONFIG_SND_HDA_RECONFIG=y
CONFIG_SND_HDA_INPUT_BEEP=y
CONFIG_SND_HDA_POWER_SAVE_DEFAULT=0
CONFIG_SND_USB_AUDIO=y
CONFIG_SND_SOC=m
CONFIG_SND_SOC_INTEL_SST_TOPLEVEL=y
CONFIG_SND_SST_ATOM_HIFI2_PLATFORM_ACPI=m
CONFIG_SND_SOC_INTEL_BYTCR_RT5640_MACH=m
CONFIG_SND_SOC_INTEL_BYTCR_RT5651_MACH=m
CONFIG_SND_SOC_INTEL_CHT_BSW_RT5645_MACH=m

# ---- 12. 无线网卡：Intel 6205 已判定硬件级间歇故障，处理为不编译 ----
CONFIG_WLAN_VENDOR_INTEL=y
CONFIG_IWLWIFI=n
CONFIG_IWLDVM=n
CONFIG_IWLMVM=n

# ---- 13. 网络加速 / 拥塞控制 ----
CONFIG_NET_SCH_FQ_CODEL=m
CONFIG_NET_SCH_CAKE=m
CONFIG_NET_CLS_ACT=y
CONFIG_NET_CLS_BPF=m
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_TCP_CONG_BBR=y
CONFIG_DEFAULT_BBR=y
CONFIG_DEFAULT_TCP_CONG="bbr"

# ---- 14. Netfilter / NAT（模块化）----
CONFIG_NF_TABLES=m
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_CT=m
CONFIG_NFT_LOG=m
CONFIG_NFT_LIMIT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_REDIR=m
CONFIG_NFT_NAT=m
CONFIG_NFT_TUNNEL=m
CONFIG_NFT_QUOTA=m
CONFIG_NFT_REJECT=m
CONFIG_NFT_COMPAT=m
CONFIG_NFT_XFRM=m
CONFIG_NF_CONNTRACK=m
CONFIG_NETFILTER_XTABLES=m

# ---- 15. 其他工控机常用 ----
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# ---- 16. CIFS/SMB File System（模块化）----
CONFIG_CIFS=m
CONFIG_CIFS_STATS2=y
CONFIG_CIFS_ALLOW_INSECURE_LEGACY=y
CONFIG_CIFS_XATTR=y
CONFIG_CIFS_POSIX=y

